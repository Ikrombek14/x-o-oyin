<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X va O — Zamonaviy Tic Tac Toe</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tone.js for subtle sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        * {
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        /* Game cell styling & animations */
        .cell {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .cell:hover:not(.occupied):not(.game-over) {
            background: rgba(51, 65, 85, 0.7);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .cell:active:not(.occupied):not(.game-over) {
            transform: scale(0.95);
        }

        /* X and O Pop-in Animation */
        @keyframes popIn {
            0% {
                transform: scale(0.3) rotate(-15deg);
                opacity: 0;
            }
            70% {
                transform: scale(1.1) rotate(3deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .symbol-x {
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .symbol-o {
            color: #fb7185;
            text-shadow: 0 0 20px rgba(251, 113, 133, 0.6);
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Winning Cell Pulse */
        @keyframes winPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }

        .cell.win-x {
            background: rgba(56, 189, 248, 0.22);
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            animation: winPulse 1.2s infinite ease-in-out;
        }

        .cell.win-o {
            background: rgba(251, 113, 133, 0.22);
            border-color: #fb7185;
            box-shadow: 0 0 25px rgba(251, 113, 133, 0.4);
            animation: winPulse 1.2s infinite ease-in-out;
        }

        /* Floating background orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.45;
            animation: float 10s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }
    </style>
</head>
<body class="text-slate-100 flex items-center justify-center p-4">

    <!-- Background Decorative Orbs -->
    <div class="orb w-72 h-72 bg-sky-500 top-10 left-10"></div>
    <div class="orb w-80 h-80 bg-rose-500 bottom-10 right-10" style="animation-delay: -5s;"></div>

    <!-- Main Game Container -->
    <main class="glass-panel w-full max-w-md rounded-3xl p-5 sm:p-7 flex flex-col gap-5">
        
        <!-- Header & Sound Toggle -->
        <header class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-sky-400 via-indigo-300 to-rose-400 bg-clip-text text-transparent">
                    X va O
                </h1>
                <p class="text-xs text-slate-400 font-medium">Mantiqiy strategiya o'yini</p>
            </div>
            <button id="soundToggle" title="Ovozni yoqish/o'chirish" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 text-slate-300 transition active:scale-95">
                <!-- Sound On SVG -->
                <svg id="soundOnIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
                <!-- Sound Off SVG -->
                <svg id="soundOffIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>
            </button>
        </header>

        <!-- Game Mode Selector -->
        <div class="bg-slate-900/70 p-1.5 rounded-2xl grid grid-cols-2 gap-1.5 border border-slate-800">
            <button id="modeAiBtn" class="py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                Kompyuter bilan
            </button>
            <button id="modeFriendBtn" class="py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                Do‘st bilan
            </button>
        </div>

        <!-- Difficulty Selector (Visible only in AI mode) -->
        <div id="difficultyContainer" class="flex items-center justify-between bg-slate-800/50 px-3.5 py-2 rounded-xl border border-slate-700/50 transition-all">
            <span class="text-xs font-medium text-slate-300">Qiyinchilik darajasi:</span>
            <div class="flex gap-1.5">
                <button id="diffEasyBtn" class="px-3 py-1 rounded-lg text-xs font-semibold transition bg-slate-700/60 text-slate-300 hover:bg-slate-700">
                    Oson
                </button>
                <button id="diffHardBtn" class="px-3 py-1 rounded-lg text-xs font-semibold transition bg-sky-500/20 text-sky-400 border border-sky-500/40">
                    Qiyin (AI)
                </button>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="grid grid-cols-3 gap-2.5 text-center">
            <div class="bg-sky-500/10 border border-sky-500/20 rounded-2xl p-2.5">
                <p id="labelX" class="text-[11px] uppercase tracking-wider font-semibold text-sky-400">Siz (X)</p>
                <p id="scoreX" class="text-xl sm:text-2xl font-bold text-white mt-0.5">0</p>
            </div>
            <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-2.5">
                <p class="text-[11px] uppercase tracking-wider font-semibold text-slate-400">Durang</p>
                <p id="scoreDraw" class="text-xl sm:text-2xl font-bold text-slate-200 mt-0.5">0</p>
            </div>
            <div class="bg-rose-500/10 border border-rose-500/20 rounded-2xl p-2.5">
                <p id="labelO" class="text-[11px] uppercase tracking-wider font-semibold text-rose-400">Kompyuter (O)</p>
                <p id="scoreO" class="text-xl sm:text-2xl font-bold text-white mt-0.5">0</p>
            </div>
        </div>

        <!-- Turn & Status Indicator -->
        <div id="statusBanner" class="py-2.5 px-4 rounded-2xl bg-slate-800/80 border border-slate-700/60 text-center font-semibold text-sm sm:text-base flex items-center justify-center gap-2 transition-all">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
            <span id="statusText">Navbat: <span class="text-sky-400 font-bold">X</span></span>
        </div>

        <!-- 3x3 Game Board -->
        <div id="board" class="grid grid-cols-3 gap-3 aspect-square w-full">
            <button data-index="0" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="1" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="2" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="3" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="4" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="5" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="6" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="7" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
            <button data-index="8" class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold"></button>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3 pt-1">
            <button id="restartBtn" class="py-3 px-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-500 hover:to-sky-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/25 transition transform active:scale-95 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Qayta boshlash
            </button>
            <button id="resetScoreBtn" class="py-3 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-semibold text-sm transition transform active:scale-95 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Hisobni tozalash
            </button>
        </div>

    </main>

    <script>
        // --- O'yin holati (State) ---
        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'ai'; // 'ai' yoki 'friend'
        let difficulty = 'hard'; // 'easy' yoki 'hard'
        let isAiThinking = false;
        let soundEnabled = true;

        let scores = {
            X: 0,
            O: 0,
            draw: 0
        };

        // G'alaba kombinatsiyalari
        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Gorizontal
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Vertikal
            [0, 4, 8], [2, 4, 6]             // Diagonal
        ];

        // --- DOM Elementlari ---
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const statusBanner = document.getElementById('statusBanner');
        
        const modeAiBtn = document.getElementById('modeAiBtn');
        const modeFriendBtn = document.getElementById('modeFriendBtn');
        const difficultyContainer = document.getElementById('difficultyContainer');
        const diffEasyBtn = document.getElementById('diffEasyBtn');
        const diffHardBtn = document.getElementById('diffHardBtn');

        const labelX = document.getElementById('labelX');
        const labelO = document.getElementById('labelO');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreDrawEl = document.getElementById('scoreDraw');

        const restartBtn = document.getElementById('restartBtn');
        const resetScoreBtn = document.getElementById('resetScoreBtn');
        const soundToggle = document.getElementById('soundToggle');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');

        // --- Ovoz effektlari (Tone.js) ---
        let synth = null;
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!synth) {
                    synth = new Tone.Synth({
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.01, decay: 0.12, sustain: 0, release: 0.1 }
                    }).toDestination();
                    synth.volume.value = -10;
                }
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }

                if (type === 'X') {
                    synth.triggerAttackRelease('E5', '16n');
                } else if (type === 'O') {
                    synth.triggerAttackRelease('C5', '16n');
                } else if (type === 'win') {
                    const now = Tone.now();
                    synth.triggerAttackRelease('C5', '16n', now);
                    synth.triggerAttackRelease('E5', '16n', now + 0.1);
                    synth.triggerAttackRelease('G5', '8n', now + 0.2);
                } else if (type === 'draw') {
                    const now = Tone.now();
                    synth.triggerAttackRelease('D4', '16n', now);
                    synth.triggerAttackRelease('C4', '8n', now + 0.12);
                }
            } catch (e) {
                // Ovoz bloklangan bo'lsa xatolik chiqarmaslik
            }
        }

        // --- O'yinni ishga tushirish va hodisalar ---
        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        modeAiBtn.addEventListener('click', () => setGameMode('ai'));
        modeFriendBtn.addEventListener('click', () => setGameMode('friend'));
        diffEasyBtn.addEventListener('click', () => setDifficulty('easy'));
        diffHardBtn.addEventListener('click', () => setDifficulty('hard'));
        restartBtn.addEventListener('click', resetBoard);
        resetScoreBtn.addEventListener('click', resetScores);

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundOnIcon.classList.toggle('hidden', !soundEnabled);
            soundOffIcon.classList.toggle('hidden', soundEnabled);
        });

        // --- Rejimni o'zgartirish ---
        function setGameMode(mode) {
            if (gameMode === mode) return;
            gameMode = mode;

            if (mode === 'ai') {
                modeAiBtn.className = "py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2";
                modeFriendBtn.className = "py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white flex items-center justify-center gap-2";
                difficultyContainer.classList.remove('hidden');
                labelX.textContent = "Siz (X)";
                labelO.textContent = "Kompyuter (O)";
            } else {
                modeFriendBtn.className = "py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2";
                modeAiBtn.className = "py-2.5 px-3 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white flex items-center justify-center gap-2";
                difficultyContainer.classList.add('hidden');
                labelX.textContent = "1-O'yinchi (X)";
                labelO.textContent = "2-O'yinchi (O)";
            }

            resetScores();
        }

        // --- Qiyinchilik darajasini o'zgartirish ---
        function setDifficulty(level) {
            difficulty = level;
            if (level === 'easy') {
                diffEasyBtn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
                diffHardBtn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition bg-slate-700/60 text-slate-300 hover:bg-slate-700";
            } else {
                diffHardBtn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition bg-sky-500/20 text-sky-400 border border-sky-500/40";
                diffEasyBtn.className = "px-3 py-1 rounded-lg text-xs font-semibold transition bg-slate-700/60 text-slate-300 hover:bg-slate-700";
            }
            resetBoard();
        }

        // --- Katak bosilganda ---
        function handleCellClick(e) {
            const index = parseInt(e.currentTarget.getAttribute('data-index'));

            if (board[index] !== '' || !gameActive || isAiThinking) {
                return;
            }

            makeMove(index, currentPlayer);

            // Agar AI rejimi bo'lsa va o'yin tugamagan bo'lsa, kompyuter yuradi
            if (gameActive && gameMode === 'ai' && currentPlayer === 'O') {
                isAiThinking = true;
                updateStatusUI();
                setTimeout(() => {
                    const aiMoveIndex = getBestAiMove();
                    if (aiMoveIndex !== -1 && gameActive) {
                        makeMove(aiMoveIndex, 'O');
                    }
                    isAiThinking = false;
                    if (gameActive) updateStatusUI();
                }, 420); // Tabiiy fikrlash pauzasi
            }
        }

        // --- Yurishni amalga oshirish ---
        function makeMove(index, player) {
            board[index] = player;
            const cell = cells[index];
            cell.classList.add('occupied');
            
            const span = document.createElement('span');
            span.textContent = player;
            span.className = player === 'X' ? 'symbol-x' : 'symbol-o';
            cell.appendChild(span);

            playSound(player);

            const result = checkWinner(board);
            if (result) {
                endGame(result);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateStatusUI();
            }
        }

        // --- G'olibni tekshirish ---
        function checkWinner(currentBoard) {
            for (const combo of winningCombinations) {
                const [a, b, c] = combo;
                if (currentBoard[a] && currentBoard[a] === currentBoard[b] && currentBoard[a] === currentBoard[c]) {
                    return { winner: currentBoard[a], combo };
                }
            }
            if (!currentBoard.includes('')) {
                return { winner: 'draw', combo: null };
            }
            return null;
        }

        // --- O'yinni yakunlash ---
        function endGame(result) {
            gameActive = false;
            cells.forEach(c => c.classList.add('game-over'));

            if (result.winner === 'draw') {
                scores.draw++;
                scoreDrawEl.textContent = scores.draw;
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400";
                statusText.innerHTML = `<span class="text-amber-400 font-bold">Durang!</span> Kuchlar teng keldi.`;
                playSound('draw');
            } else {
                const winner = result.winner;
                scores[winner]++;
                scoreXEl.textContent = scores.X;
                scoreOEl.textContent = scores.O;

                // G'alaba kataklarini ajratib ko'rsatish
                result.combo.forEach(idx => {
                    cells[idx].classList.add(winner === 'X' ? 'win-x' : 'win-o');
                });

                statusDot.className = `w-2.5 h-2.5 rounded-full ${winner === 'X' ? 'bg-sky-400' : 'bg-rose-400'}`;
                
                if (gameMode === 'ai') {
                    if (winner === 'X') {
                        statusText.innerHTML = `<span class="text-sky-400 font-bold">Tabriklaymiz!</span> Siz g'alaba qozondingiz!`;
                    } else {
                        statusText.innerHTML = `<span class="text-rose-400 font-bold">Kompyuter</span> g'alaba qozondi!`;
                    }
                } else {
                    const colorClass = winner === 'X' ? 'text-sky-400' : 'text-rose-400';
                    statusText.innerHTML = `<span class="${colorClass} font-bold">${winner}</span> o'yinchisi g'alaba qozondi!`;
                }
                playSound('win');
            }
        }

        // --- Navbat ko'rsatkichini yangilash ---
        function updateStatusUI() {
            if (!gameActive) return;

            if (gameMode === 'ai') {
                if (currentPlayer === 'X') {
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse";
                    statusText.innerHTML = `Sizning navbatingiz: <span class="text-sky-400 font-bold">X</span>`;
                } else {
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-400 animate-ping";
                    statusText.innerHTML = `Kompyuter o'ylamoqda...`;
                }
            } else {
                const colorClass = currentPlayer === 'X' ? 'text-sky-400' : 'text-rose-400';
                const dotColor = currentPlayer === 'X' ? 'bg-sky-400' : 'bg-rose-400';
                statusDot.className = `w-2.5 h-2.5 rounded-full ${dotColor} animate-pulse`;
                statusText.innerHTML = `Navbat: <span class="${colorClass} font-bold">${currentPlayer}</span>`;
            }
        }

        // --- Doskani tozalash (Qayta boshlash) ---
        function resetBoard() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameActive = true;
            isAiThinking = false;

            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.className = 'cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-extrabold';
            });

            updateStatusUI();
        }

        // --- Hisobni tozalash ---
        function resetScores() {
            scores = { X: 0, O: 0, draw: 0 };
            scoreXEl.textContent = '0';
            scoreOEl.textContent = '0';
            scoreDrawEl.textContent = '0';
            resetBoard();
        }

        // --- Sun'iy Intellekt (AI) Mantiqi ---
        function getBestAiMove() {
            const availableMoves = board
                .map((val, idx) => val === '' ? idx : null)
                .filter(val => val !== null);

            if (availableMoves.length === 0) return -1;

            // Oson rejim: tasodifiy yurish (ba'zida g'alabani ko'ra oladi)
            if (difficulty === 'easy') {
                const randomIndex = Math.floor(Math.random() * availableMoves.length);
                return availableMoves[randomIndex];
            }

            // Qiyin rejim: Minimax algoritmi (yengilmas AI)
            let bestScore = -Infinity;
            let bestMove = availableMoves[0];

            // Birinchi yurishda markaz bo'sh bo'lsa darhol markazni olish (tezlik uchun)
            if (availableMoves.length === 8 && board[4] === '') {
                return 4;
            }

            for (let i = 0; i < availableMoves.length; i++) {
                const move = availableMoves[i];
                board[move] = 'O';
                let score = minimax(board, 0, false);
                board[move] = '';

                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }
            return bestMove;
        }

        const aiScores = {
            O: 10,
            X: -10,
            draw: 0
        };

        function minimax(currentBoard, depth, isMaximizing) {
            const result = checkWinner(currentBoard);
            if (result !== null) {
                if (result.winner === 'O') return aiScores.O - depth;
                if (result.winner === 'X') return aiScores.X + depth;
                return aiScores.draw;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currentBoard[i] === '') {
                        currentBoard[i] = 'O';
                        let score = minimax(currentBoard, depth + 1, false);
                        currentBoard[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currentBoard[i] === '') {
                        currentBoard[i] = 'X';
                        let score = minimax(currentBoard, depth + 1, true);
                        currentBoard[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        // Boshlang'ich holatni o'rnatish
        updateStatusUI();
    </script>
